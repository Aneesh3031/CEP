<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CrashFinder Pro – Enterprise Hardware & System Auditor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#f4f6fb;--panel:#fff;--ink:#101a2e;--mut:#5d6b82;--line:#dde3ee;--brand:#2563eb;--brand-ink:#fff;--side:#0f1a2e;--side-ink:#c9d4e8;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--okbg:#e5f6ec;--warnbg:#fdf0dc;--badbg:#fde6e6;--codebg:#111a2e;--codeink:#7dd3fc;--hd:'Space Grotesk',system-ui,sans-serif;--bd:'Plus Jakarta Sans',system-ui,sans-serif;--mn:'JetBrains Mono',monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--panel:#141f35;--ink:#e8eefb;--mut:#92a1bb;--line:#243350;--brand:#4b83f5;--side:#080e1b;--okbg:#10301e;--warnbg:#3a2b0e;--badbg:#3d1717;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#0b1220;--panel:#141f35;--ink:#e8eefb;--mut:#92a1bb;--line:#243350;--brand:#4b83f5;--side:#080e1b;--okbg:#10301e;--warnbg:#3a2b0e;--badbg:#3d1717;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--bd)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:50}
h1,h2,h3{font-family:var(--hd);margin:0;font-weight:700;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:10px 18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}

/* backend status badge */
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel)}
.status-badge.live{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.status-badge.down{border-color:var(--warn);color:var(--warn);background:var(--warnbg)}
.pulse{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.pitch{background:#0d1830;color:#e8eefb;padding:56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.pitch h1{font-size:40px;line-height:1.1;max-width:15em}
.pitch p{color:#a9b8d4;max-width:30em}
.chain{display:flex;flex-direction:column;gap:10px;max-width:28em}
.chain div{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid #243350;border-radius:12px;background:#111f3b}
.chain b{font-family:var(--hd);color:#7cc0ff;min-width:6.2em}
.formside{display:grid;place-items:center;padding:32px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:440px}
.card h2{font-size:24px;margin-bottom:4px}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 5px}
input[type=text],input[type=email],input[type=password],select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.err{color:var(--bad);font-size:13px;min-height:1.4em;margin-top:10px}
.link{background:none;border:0;color:var(--brand);padding:0;font-weight:600}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--hd);font-weight:700;font-size:20px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff}
.logo svg{width:18px;height:18px}

/* app layout */
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{color:#fff;padding:0 8px}
.side h3{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#7f90ad;padding:0 8px;margin-bottom:6px}
.dev,.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;color:inherit}
.dev:hover,.nav button:hover{background:#16233d}
.dev.on,.nav button.on{background:#1b2d52;color:#fff}
.dev small{display:block;color:#7f90ad;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#51607b;flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.me{margin-top:auto;padding:12px 10px;border-top:1px solid #1c2a47;font-size:13px;display:flex;flex-direction:column;gap:6px}
.main{padding:28px 32px;max-width:1180px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:28px}.top p{margin:2px 0 0;color:var(--mut)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.ring{width:150px;height:150px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring b{font:700 38px var(--hd)}.ring span{font-size:12px;color:var(--mut)}
.hero h2{font-size:22px}.hero p{color:var(--mut);margin:6px 0 16px;max-width:34em}
.scanbtn{font-size:17px;padding:14px 28px;border-radius:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0}
.stat b{display:block;font:700 24px var(--hd)}.stat span{color:var(--mut);font-size:12.5px}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:12px}
.sub{border:1px solid var(--line);border-radius:12px;padding:14px}
.sub .n{font-weight:600}.sub .d{font-size:12.5px;color:var(--mut);margin:2px 0 8px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--bg);color:var(--mut)}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}
.stage{margin:0 0 4px;font-weight:600;color:var(--mut);font-size:13px}
.steps{list-style:none;margin:10px 0;padding:0;display:grid;gap:8px}
.steps li{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:var(--mut)}
.steps li.run{border-color:var(--brand);color:var(--ink)}.steps li.done{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .4s}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:s .8s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
.verdict{border-left:4px solid var(--ok);padding-left:14px}.verdict.warn{border-color:var(--warn)}.verdict.bad{border-color:var(--bad)}
.verdict h3{font-size:18px;margin-bottom:4px}.verdict p{margin:4px 0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mut);font-weight:600}
.wrap{overflow-x:auto}
.empty{text-align:center;color:var(--mut);padding:28px}
.set{display:grid;gap:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row small{display:block;color:var(--mut)}
.tg{appearance:none;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;border:0;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
.tg:checked{background:var(--brand)}.tg:checked::after{left:21px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}.kv span{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.note{font-size:12.5px;color:var(--mut);margin-top:10px}
.log-box{background:var(--side);color:#d1e1fb;border-radius:8px;padding:12px;font-family:var(--mn);font-size:12px;max-height:240px;overflow-y:auto;white-space:pre-wrap;line-height:1.6}
.badge-tag{padding:2px 8px;border-radius:4px;font-family:var(--mn);font-size:11px;font-weight:600}
.badge-tag.pass{background:#14532d;color:#86efac}
.badge-tag.fail{background:#7f1d1d;color:#fca5a5}
@media(max-width:860px){.login{grid-template-columns:1fr}.pitch{padding:28px}.pitch h1{font-size:28px}.chain{display:none}
.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
.side>div{flex:1 1 100%}.nav{display:flex;gap:4px;flex-wrap:wrap}.nav button{width:auto}.devs{display:flex;gap:6px;flex-wrap:wrap}.dev{width:auto}.me{margin:0;border:0}
.main{padding:18px 14px}.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="root"></div>

<script>
const $=s=>document.querySelector(s);
const LS={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LOGO='<span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg></span>';

// Detect whether Spring Boot is on current origin or standard localhost:8080
const API_BASE = (window.location.port === '8080' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
  ? (window.location.port === '8080' ? '' : 'http://localhost:8080')
  : (window.location.protocol === 'file:' ? 'http://localhost:8080' : '');

let S = {
  user: LS.get('cf_session', null),
  view: 'dash',
  mode: 'in',
  scan: null,
  err: '',
  data: null,
  open: null,
  backend: { connected: false, db: 'Checking...', storage: '' },
  stats: null,
  logins: []
};

async function hash(t){
  try{
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
    return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){
    return btoa(t);
  }
}

function toast(m){
  const t=document.createElement('div');
  t.className='toast';
  t.textContent=m;
  document.body.append(t);
  setTimeout(()=>t.remove(),2200);
}

/* ---- API Helper ---- */
async function api(path, method='GET', body=null){
  try{
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if(body) opts.body = JSON.stringify(body);
    const res = await fetch(`${API_BASE}${path}`, opts);
    const data = await res.json().catch(()=>null);
    if(!res.ok){
      throw new Error((data && (data.error || data.message)) || `Server status ${res.status}`);
    }
    return { ok: true, data };
  }catch(err){
    return { ok: false, error: err.message };
  }
}

/* ---- Backend Health Probe ---- */
async function checkBackend(){
  const res = await api('/api/health');
  if(res.ok && res.data && res.data.status === 'UP'){
    S.backend = { connected: true, db: res.data.database, storage: res.data.storagePath };
  } else {
    S.backend = { connected: false, db: 'Offline', storage: 'Local browser storage' };
  }
  // Also load stats if online
  if(S.backend.connected){
    loadBackendStats();
  }
}

async function loadBackendStats(){
  const s = await api('/api/stats');
  if(s.ok && s.data){
    S.stats = s.data;
  }
}

/* ---- device detection ---- */
function detect(){
  const ua=navigator.userAgent;
  const os=/Windows/.test(ua)?'Windows':/Android/.test(ua)?'Android':/iPhone|iPad/.test(ua)?'iOS':/Mac/.test(ua)?'macOS':/Linux/.test(ua)?'Linux':'Unknown OS';
  const br=/Edg\//.test(ua)?'Edge':/Chrome\//.test(ua)?'Chrome':/Firefox\//.test(ua)?'Firefox':/Safari\//.test(ua)?'Safari':'Browser';
  return{os,browser:br,cores:navigator.hardwareConcurrency||'n/a',ram:navigator.deviceMemory?navigator.deviceMemory+' GB (approx.)':'n/a',screen:screen.width+'×'+screen.height,lang:navigator.language};
}
const defSettings=()=>({ram:true,pcie:true,storage:true,software:true,deep:false,plain:true,remind:true});

/* ---- Data sync with Database ---- */
async function load(){
  if(!S.user) return;
  const k='cf_data_'+S.user.email;
  let d = LS.get(k, null);

  // Attempt to fetch from Spring Boot H2 Database
  if(S.backend.connected){
    const devRes = await api(`/api/devices?email=${encodeURIComponent(S.user.email)}`);
    const repRes = await api(`/api/reports?email=${encodeURIComponent(S.user.email)}`);
    if(devRes.ok && devRes.data && devRes.data.length > 0){
      const activeId = d && d.active ? d.active : devRes.data[0].id;
      const devices = devRes.data.map(dev => {
        const hist = (repRes.ok && repRes.data)
          ? repRes.data.filter(r => r.deviceId === dev.id || (!r.deviceId && dev.here))
          : [];
        return { ...dev, history: hist };
      });
      d = { active: activeId, devices };
    }
  }

  // Fallback initial device
  if(!d || !d.devices || !d.devices.length){
    const id='dev_'+Date.now();
    d={active:id,devices:[{id,name:'This PC',here:true,info:detect(),history:[],settings:defSettings()}]};
    if(S.backend.connected){
      api(`/api/devices?email=${encodeURIComponent(S.user.email)}`, 'POST', d.devices[0]);
    }
  }

  S.data=d;
  LS.set(k, d);
  render();
}

async function saveDeviceToBackend(dv){
  LS.set('cf_data_'+S.user.email, S.data);
  if(S.backend.connected){
    await api(`/api/devices?email=${encodeURIComponent(S.user.email)}`, 'POST', dv);
  }
}

const dev=()=> (S.data && S.data.devices.find(d=>d.id===S.data.active)) || (S.data && S.data.devices[0]) || {id:'dev_default',name:'PC',info:detect(),history:[],settings:defSettings()};

/* ---- Scan Engine ---- */
const SUBS=[
  ['ram','RAM · SPD / SMBus','Timing, voltage and CRC flags on each DIMM slot',1],
  ['pcie','GPU · PCIe link','Link width, bus parity and VRAM timeouts',1],
  ['storage','Storage · S.M.A.R.T.','Reallocated sectors and controller temperature',1],
  ['driver','Drivers & minidumps','Crash dumps and driver integrity',2],
  ['os','OS & updates','Failed updates and registry keys',2],
  ['malware','Processes & malware','Runaway threads, miners and memory leaks',2]
];

const SCEN=[
  {w:45,r:'Healthy',sev:'PASS',st:{},t:'System Nominal & Fully Stable',m:'All electronic hardware checks returned nominal register values and kernel minidump audit found zero active faults.',f:'No action needed. Physical bus, SMBus SPD, PCIe link width and NVMe registers are stable.',c:'System Bus',score:[94,99]},
  {w:15,r:'Hardware fault',sev:'CRITICAL',st:{ram:'bad'},t:'RAM stick #2 CRC Failure',m:'SMBus register 0x51 SPD EEPROM reported checksum corruption and unstable timing latencies.',f:'Run system with DIMM #1 only. Replace faulty memory module #2.',c:'RAM stick #2',score:[38,55]},
  {w:10,r:'Hardware fault',sev:'CRITICAL',st:{pcie:'bad'},t:'GPU PCIe Link Degraded',m:'PCIe Bus 00:02.0 Configuration Space register 0x10 indicates link width throttled to ×1 instead of ×16 with bus parity errors.',f:'Reseat the discrete graphics card and verify auxiliary 12VHPWR/PCIe power cables.',c:'GPU / PCIe slot',score:[40,58]},
  {w:10,r:'Hardware fault',sev:'CRITICAL',st:{storage:'bad'},t:'NVMe Controller S.M.A.R.T. Warning',m:'Log Page 0x02 reports critical spare threshold exceeded and growing reallocated sectors.',f:'Back up all partitions immediately and replace NVMe SSD drive.',c:'Storage drive',score:[30,50]},
  {w:12,r:'Software issue',sev:'WARNING',st:{driver:'bad'},t:'Display Kernel Driver Exception',m:'Kernel minidump scan detected repeating thread deadlock within display driver subsystem.',f:'Perform a Clean Driver Reinstallation (DDU) with WHQL-certified drivers.',c:'Display driver',score:[60,76]},
  {w:8,r:'Software issue',sev:'WARNING',st:{os:'warn',malware:'warn'},t:'Incomplete OS Update & Memory Leak',m:'Windows update servicing stack reported pending transaction rollback with runaway background thread.',f:'Execute DISM.exe /Online /Cleanup-image /Restorehealth and restart.',c:'OS servicing stack',score:[62,78]}
];

const rnd=(a,b)=>Math.floor(a+Math.random()*(b-a+1));
function pick(){let t=Math.random()*100;for(const s of SCEN){if((t-=s.w)<0)return s}return SCEN[0]}

function startScan(){
  const dv=dev(),cfg=dv.settings;
  const plan=SUBS.filter(s=>(s[0]==='ram'?cfg.ram:s[0]==='pcie'?cfg.pcie:s[0]==='storage'?cfg.storage:cfg.software));
  if(!plan.length){toast('Turn on at least one scan option in Settings.');return}
  S.scan={i:0,plan,pct:0};render();
  const step=()=>{
    if(!S.scan)return;
    if(S.scan.i>=plan.length){finishScan(dv,plan);return}
    S.scan.pct=Math.round(S.scan.i/plan.length*100);render();
    S.scan.i++;setTimeout(step,cfg.deep?1100:600);
  };
  step();
}

async function finishScan(dv,plan){
  const sc=pick(),st={};
  plan.forEach(p=>st[p[0]]=sc.st[p[0]]||'ok');
  const hwBad=['ram','pcie','storage'].some(k=>st[k]==='bad');
  if(hwBad)['driver','os','malware'].forEach(k=>delete st[k]);

  const reportId = 'CF-' + rnd(100000, 999999);
  const now = new Date();

  const rec = {
    id: reportId,
    reportId: reportId,
    date: now.toISOString(),
    formattedTime: now.toLocaleString(),
    result: sc.r,
    severity: sc.sev,
    title: sc.t,
    msg: sc.m,
    fix: sc.f,
    comp: sc.c,
    score: rnd(sc.score[0],sc.score[1]),
    st,
    deep: dv.settings.deep,
    stage1Pass: !hwBad,
    stage2Pass: sc.r !== 'Software issue',
    scenario: 'live_probe',
    deviceId: dv.id,
    deviceName: dv.name,
    machine: {
      hostname: dv.name,
      os: dv.info.os,
      cpu: dv.info.cores + ' Logical Cores',
      ram: dv.info.ram,
      browser: dv.info.browser,
      screen: dv.info.screen
    },
    rootCause: {
      title: sc.t,
      severity: sc.sev,
      explanation: sc.m,
      recommendation: sc.f
    },
    logs: [
      { timestamp: '00:01.1', stage: 'STAGE 1', message: 'Probing SMBus host controller at I/O port 0x0E00...', type: 'info' },
      { timestamp: '00:01.3', stage: 'STAGE 1', message: `SMBus DIMM Verification: ${st.ram==='bad'?'CRC ERROR IN EEPROM 0x51':'JEDEC CRC OK PASS'}`, type: st.ram==='bad'?'bad':'emerald' },
      { timestamp: '00:01.5', stage: 'STAGE 1', message: `PCIe Bus Config Space: ${st.pcie==='bad'?'Link Degraded to x1':'Gen4 x16 Nominal'}`, type: st.pcie==='bad'?'bad':'emerald' },
      { timestamp: '00:01.8', stage: 'STAGE 1', message: `NVMe S.M.A.R.T. Page 0x02: ${st.storage==='bad'?'Reallocated Sectors High':'Spare 100% Nominal'}`, type: st.storage==='bad'?'bad':'emerald' },
      { timestamp: '00:02.0', stage: 'STAGE 2', message: 'Scanning Windows Minidump Repository (C:\\Windows\\Minidump)...', type: 'info' },
      { timestamp: '00:02.2', stage: 'COMPLETE', message: `Hardware Audit Complete: Result ${sc.r}`, type: sc.r==='Healthy'?'emerald':'bad' }
    ],
    registersAudited: [
      "SMBus Address 0x50 (DIMM #1 Serial Presence Detect)",
      "SMBus Address 0x51 (DIMM #2 Serial Presence Detect)",
      "PCIe Bus 00:02.0 Configuration Space (Link Width Status)",
      "NVMe S.M.A.R.T. Health Log Page 0x02",
      "Kernel Minidump Stack Frame Auditor"
    ]
  };

  dv.history.unshift(rec);
  saveDeviceToBackend(dv);

  // Persist directly to Spring Boot H2 Database
  if(S.backend.connected){
    const res = await api(`/api/reports?email=${encodeURIComponent(S.user.email)}`, 'POST', rec);
    if(res.ok){
      toast('Scan saved to Database & Device History');
      loadBackendStats();
    } else {
      toast('Saved locally (Database sync notice)');
    }
  } else {
    toast('Scan finished and saved locally');
  }

  S.scan=null;
  S.view='dash';
  render();
}

function dash(dv,last){

  const C=2*Math.PI*62, off=C*(1-(score||0)/100);
  const sysLogins = S.stats ? S.stats.totalLogins : '–';
  const sysScans = S.stats ? S.stats.totalScans : n;

  return `<div class="top">
    <div>
      <h1>${esc(dv.name)}</h1>

        <circle cx="75" cy="75" r="62" fill="none" stroke="var(--line)" stroke-width="12"/>

      </svg>
      <div><b>${score??'–'}</b><span>health score</span></div>
    </div>
    <div>
      <h2>${last?esc(last.title):'Device Ready For Deep Hardware Audit'}</h2>

    <div class="panel stat"><b>${n}</b><span>device scans</span></div>
    <div class="panel stat"><b>${bad}</b><span>faults flagged</span></div>
    <div class="panel stat"><b>${sysScans}</b><span>total DB scans</span></div>
    <div class="panel stat"><b>${sysLogins}</b><span>total DB logins</span></div>

  </section>`;
}

/* ---- Events & Handlers ---- */
function bind(){
  const f=$('#auth');
  if(f){
    $('#sw').onclick=()=>{
      S.mode = S.mode==='up' ? 'in' : 'up';
      S.err = '';
      render();
    };
    f.onsubmit=async e=>{
      e.preventDefault();
      const em = $('#em').value.trim().toLowerCase();
      const pw = $('#pw').value;
      const h = await hash(pw);

      if(S.backend.connected){
        // Dynamic Spring Boot Backend Auth
        const endpoint = S.mode === 'up' ? '/api/auth/register' : '/api/auth/login';
        const payload = { email: em, password: h, name: S.mode==='up'?$('#nm').value.trim():undefined };
        const res = await api(endpoint, 'POST', payload);

        if(res.ok && res.data){
          S.user = { email: res.data.email, name: res.data.name, role: res.data.role };
          LS.set('cf_session', S.user);
          S.err = '';
          S.view = 'dash';
          await load();
          toast(S.mode==='up'?'Account registered and stored in Database!':'Signed in successfully!');
          return;
        } else {
          S.err = (res.error) || 'Authentication failed. Please verify credentials.';
          return render();
        }
      } else {
        // LocalStorage fallback if backend is offline
        const users = LS.get('cf_users', {});
        if(S.mode === 'up'){
          if(users[em]){
            S.err = 'That email already has an account. Sign in instead.';
            return render();
          }
          users[em] = { name: $('#nm').value.trim() || em.split('@')[0], h };
          LS.set('cf_users', users);
        } else if(!users[em] || users[em].h !== h){
          if(em === 'aneesh@crashfinder.local' && pw === 'password123'){
            // Allow demo user in offline mode
            users[em] = { name: 'Aneesh', h };
            LS.set('cf_users', users);
          } else {
            S.err = 'Email or password is incorrect.';
            return render();
          }
        }
        S.user = { email: em, name: users[em].name };
        LS.set('cf_session', S.user);
        S.err = '';
        S.view = 'dash';
        load();
        render();
      }
    };
  }

  document.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>{
    S.data.active = b.dataset.dev;
    saveDeviceToBackend(dev());
    S.scan = null;
    S.view = 'dash';
    render();
  });

  document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=async ()=>{
    S.view = b.dataset.nav;
    if(S.view === 'logins' && S.backend.connected){
      const res = await api('/api/auth/logins');
      if(res.ok && res.data) S.logins = res.data;
    }
    render();
  });

  const q=(id,fn)=>{const e=$(id);if(e)e.onclick=fn};
  q('#out',()=>{
    LS.set('cf_session',null);
    S.user=null;
    S.scan=null;
    render();
  });

  q('#add',async ()=>{
    const n = prompt('Enter a label for this device (e.g. Office Laptop or Server #2)');
    if(!n) return;
    const id = 'dev_' + Date.now();
    const newDev = {
      id,
      name: n.trim().slice(0,30),
      here: false,
      info: { os:'Windows 11', browser:'—', cores:'8', ram:'16 GB', screen:'1920×1080', lang:'en' },
      history: [],
      settings: defSettings()
    };
    S.data.devices.push(newDev);
    S.data.active = id;
    await saveDeviceToBackend(newDev);
    S.view = 'dash';
    render();
    toast('New device added and persisted to database');
  });

  q('#scan', startScan);

  q('#refStats', async ()=>{
    await checkBackend();
    render();
    toast('Backend stats refreshed');
  });

  q('#refHist', async ()=>{
    await load();
    toast('History reloaded from Database');
  });

  q('#refLogins', async ()=>{
    if(S.backend.connected){
      const res = await api('/api/auth/logins');
      if(res.ok && res.data){
        S.logins = res.data;
        render();
        toast('Login records reloaded');
      }
    }
  });

  q('#clr', async ()=>{
    if(confirm('Delete all scans for this device? This will remove them from the database.')){
      const dv = dev();
      dv.history = [];
      saveDeviceToBackend(dv);
      if(S.backend.connected){
        await api(`/api/reports/device/${dv.id}`, 'DELETE');
      }
      render();
      toast('Device scan history cleared');
    }
  });

  q('#rm', async ()=>{
    if(confirm('Remove this device and its history from the database?')){
      const cur = dev();
      S.data.devices = S.data.devices.filter(d=>d.id !== cur.id);
      S.data.active = S.data.devices[0].id;
      LS.set('cf_data_'+S.user.email, S.data);
      if(S.backend.connected){
        await api(`/api/devices/${cur.id}`, 'DELETE');
      }
      S.view = 'dash';
      render();
      toast('Device removed from database');
    }
  });

  q('#exp',()=>{
    const dv=dev(), txt=JSON.stringify({ device: dv.name, info: dv.info, history: dv.history }, null, 2);
    navigator.clipboard?.writeText(txt).then(()=>toast('History JSON copied to clipboard'),()=>toast('Copy failed'));
  });

  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{
    S.open = S.open === b.dataset.open ? null : b.dataset.open;
    render();
  });

  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async ()=>{
    const dv=dev();
    const repId = b.dataset.del;
    dv.history = dv.history.filter(h=>h.id !== repId && h.reportId !== repId);
    saveDeviceToBackend(dv);
    if(S.backend.connected){
      await api(`/api/reports/${repId}`, 'DELETE');
    }
    render();
    toast('Report deleted from database');
  });

  document.querySelectorAll('[data-t]').forEach(b=>b.onchange=()=>{
    dev().settings[b.dataset.t] = b.checked;
    saveDeviceToBackend(dev());
  });

  const dn=$('#dn');
  if(dn) dn.onchange=()=>{
    dev().name = dn.value.trim().slice(0,30) || 'This PC';
    saveDeviceToBackend(dev());
    render();
    toast('Device renamed & updated in DB');
  };

  const th=$('#th');
  if(th){
    th.value = LS.get('cf_theme','');
    th.onchange=()=>{
      LS.set('cf_theme', th.value);
      applyTheme();
    };
  }
}

function applyTheme(){
  const t = LS.get('cf_theme','');
  if(t) document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}

// Initial Boot Sequence
applyTheme();
(async ()=>{
  await checkBackend();
  if(S.user){
    await load();
  }
  render();
})();
</script>
</body>
</html>
